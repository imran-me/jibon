/* ── View: Analytics ───────────────────────────────────────────────────── */
function vAnalytics(){
  var J=jib(),B=base();
  var rows=[
    ['Call → dispatch',med(J.map(function(c){return c.dec})),med(B.map(function(c){return c.dec})),1],
    ['Time on scene',med(J.map(function(c){return c.scene})),med(B.map(function(c){return c.scene})),1],
    ['End to end',med(J.map(function(c){return c.total})),med(B.map(function(c){return c.total})),1],
    ['Hospital lead time',avg(J.map(function(c){return c.lead})),0,0]
  ];
  var byT={};CASES.forEach(function(c){byT[c.type]=(byT[c.type]||0)+1});
  var tl=Object.keys(byT).map(function(k){return[k,byT[k]]}).sort(function(a,b){return b[1]-a[1]});
  var mx=Math.max.apply(null,tl.map(function(x){return x[1]}));
  var savedPer=(med(B.map(function(c){return c.total}))-med(J.map(function(c){return c.total})));

  return '<div class="hd"><h1>Impact</h1><p>Computed from the dataset — the same emergencies, the same roads</p></div>'+
  '<div class="grid g4" style="margin-bottom:16px">'+
    '<div class="card"><div class="lab eyebrow">Minutes saved per case</div>'+
    '<div style="font-size:32px;font-weight:500;letter-spacing:-.03em;color:var(--green);margin-top:6px">'+
    Math.round(savedPer)+'</div><div class="hint" style="font-size:11.5px;color:var(--dim)">median, end to end</div></div>'+
    '<div class="card"><div class="lab eyebrow">Dispatch decision</div>'+
    '<div style="font-size:32px;font-weight:500;letter-spacing:-.03em;color:var(--green);margin-top:6px">'+
    Math.round((1-med(J.map(function(c){return c.dec}))/med(B.map(function(c){return c.dec})))*100)+'%</div>'+
    '<div class="hint" style="font-size:11.5px;color:var(--dim)">faster than conventional</div></div>'+
    '<div class="card"><div class="lab eyebrow">Hospital lead time</div>'+
    '<div style="font-size:32px;font-weight:500;letter-spacing:-.03em;color:var(--green);margin-top:6px">'+
    Math.round(avg(J.map(function(c){return c.lead})))+' min</div>'+
    '<div class="hint" style="font-size:11.5px;color:var(--dim)">was zero — hospital learned at the door</div></div>'+
    '<div class="card"><div class="lab eyebrow">Equipment matched</div>'+
    '<div style="font-size:32px;font-weight:500;letter-spacing:-.03em;color:var(--green);margin-top:6px">'+
    pct(J.filter(function(c){return c.kit}).length/J.length)+'</div>'+
    '<div class="hint" style="font-size:11.5px;color:var(--dim)">from '+pct(B.filter(function(c){return c.kit}).length/B.length)+' conventionally</div></div>'+
  '</div>'+
  '<div class="grid g2">'+
    '<div class="card"><h3>Where the time goes</h3>'+
    '<div class="sub">Median minutes per stage, conventional vs coordinated</div>'+
    rows.map(function(r){
      var m=Math.max(r[1],r[2],1);
      return '<div style="margin-bottom:14px"><div class="row between" style="font-size:12.5px;margin-bottom:5px">'+
      '<span style="color:var(--mid)">'+esc(r[0])+'</span>'+
      '<span class="num"><span style="color:var(--dim)">'+mins(r[2])+'</span> → '+
      '<b style="color:var(--green)">'+mins(r[1])+'</b></span></div>'+
      '<div class="meter" style="height:7px;margin-bottom:3px"><i style="width:'+(r[2]/m*100)+'%;background:var(--line2)"></i></div>'+
      '<div class="meter" style="height:7px"><i style="width:'+(r[1]/m*100)+'%;background:var(--green)"></i></div></div>'}).join('')+
    '<p style="font-size:11.5px;color:var(--dim)">Grey is conventional dispatch. Green is JIBON. '+
    'Road time is identical in both — the platform does not change physics, only what is known before the wheels turn.</p></div>'+
    '<div class="card"><h3>Case mix</h3><div class="sub">Click a type to see those cases</div><div class="bars">'+
    tl.map(function(t){return '<button class="b" onclick="filterType(\''+t[0]+'\')">'+
      '<span class="bl">'+TYPES[t[0]].i+' '+esc(TYPES[t[0]].n)+'</span><span class="bv num">'+t[1]+'</span>'+
      '<span class="bt meter"><i style="width:'+(t[1]/mx*100)+'%;background:var(--green)"></i></span></button>'}).join('')+
    '</div></div>'+
  '</div>'+
  '<div class="card" style="margin-top:14px"><h3>Two pipelines, one emergency</h3>'+
  '<div class="sub">Amber steps are time spent recovering information that already existed somewhere in the chain</div>'+
  pipe('Conventional',['Emergency','Call','Explain','Dispatch','Arrive','Assess','Hospital learns','Prepare','Treat'],['Explain','Assess','Hospital learns','Prepare'],false)+
  pipe('JIBON',['Emergency','AI understands','Right people connected','Resources prepared','Ambulance en route','Hospital preparing','Patient arrives','Treatment begins'],[],true)+
  '<div class="hero">Don\'t wait for the patient to arrive before preparing for the patient.'+
  '<span>Every minute before treatment matters.</span></div></div>'+
  '<div class="card" style="margin-top:14px;border-left:3px solid var(--green)">'+
  '<h3>What we can honestly claim</h3>'+
  '<p style="font-size:13px;color:var(--mid);line-height:1.7;margin-top:8px">'+
  'Time is the dominant variable in emergency survival, and this attacks time at four separate points: '+
  '<b>recognition, routing, equipment, and destination readiness</b>. Cardiac arrest survival falls roughly '+
  '7–10% for every minute without intervention. On this dataset the coordinated model recovers a median of '+
  '<b>'+Math.round(savedPer)+' minutes per case</b> and gives the receiving hospital <b>'+
  Math.round(avg(J.map(function(c){return c.lead})))+' minutes</b> of preparation it previously had none of.<br><br>'+
  'None of it requires a new ambulance, a new theatre or a new doctor. '+
  '<b>The resources already exist — only the information was missing.</b></p></div>';
}

function pipe(label,steps,slow,on){return '<div class="pipe'+(on?' on':'')+'"><span class="pl">'+esc(label)+'</span>'+
  steps.map(function(x,i){return (i?'<span class="arw">\u2192</span>':'')+'<span class="stp'+(slow.indexOf(x)>=0?' slow':'')+'">'+esc(x)+'</span>'}).join('')+'</div>'}

/* ── Drill-downs: no number is a dead end ──────────────────────────────── */
/* keep=true updates an already-open sheet in place (no re-mount, so the
   slide-in animation does not replay and the scroll position survives). */
function sheet(title,eyebrow,body,keep){
  var head='<div><div class="eyebrow">'+esc(eyebrow)+'</div>'+
    '<h2 style="margin-top:4px">'+esc(title)+'</h2></div>'+
    '<button class="x" onclick="closeSheet()">×</button>';
  var ex=keep&&$('#ov .sheet');
  if(ex){
    var bd=ex.querySelector('.body'),top=bd.scrollTop;
    ex.querySelector('header').innerHTML=head;
    bd.innerHTML=body;bd.scrollTop=top;
    return;
  }
  $('#ov').innerHTML='<div class="scrim" onclick="closeSheet()"></div><div class="sheet">'+
    '<header>'+head+'</header><div class="body">'+body+'</div></div>';
}
function closeSheet(){$('#ov').innerHTML='';selCase=null}

function drill(k){
  var act=CASES.filter(active),J=jib(),B=base(),list,title,body='';
  if(k==='active'){list=act;title='Active emergencies'}
  else if(k==='critical'){list=act.filter(function(c){return c.pri==='P1'});title='Critical cases (P1)'}
  else if(k==='transit'){list=act.filter(function(c){return c.stage==='Transporting'});title='Units in transit'}
  else if(k==='hosp'){
    var by={};act.filter(function(c){return c.mode==='jibon'&&c.prep!=='Not notified'}).forEach(function(c){(by[c.dest]=by[c.dest]||[]).push(c)});
    body='<div class="stats">'+st('Facilities',Object.keys(by).length)+
      st('Inbound cases',act.filter(function(c){return c.mode==='jibon'}).length)+'</div>'+
      Object.keys(by).map(function(h){return '<button class="node" onclick="openHosp(\''+h+'\')">'+
        '<span class="ic">🏥</span><span style="flex:1"><span class="nm">'+esc(HOSP[h].n)+'</span>'+
        '<span class="ns">'+esc(HOSP[h].c)+' · '+by[h].length+' inbound</span></span>'+
        (function(){var best=by[h].map(function(c){return c.prep}).sort(function(a,b){var o={'Team ready':0,'Received':1,'Preparing':2,'Notified':3};return (o[a]||9)-(o[b]||9)})[0];return '<span class="pill '+prepCls(best)+'">'+esc(best)+'</span>'})()+'</button>'}).join('');
    sheet('Hospitals preparing','Live readiness',body);return}
  else if(k==='lead'){
    body='<div class="stats">'+st('Mean lead',mins(avg(J.map(function(c){return c.lead}))))+
      st('Conventional','0 min','zero by definition')+
      st('Best case',mins(Math.max.apply(null,J.map(function(c){return c.lead}))))+'</div>'+
      '<div class="quote">In the conventional chain this number is zero: the hospital learns about the patient '+
      'when the ambulance doors open. Every minute here is preparation that used to happen after arrival — '+
      'the theatre, the blood cross-match, the specialist team.</div>';
    sheet('Pre-arrival lead time','How long the hospital had the case',body);return}
  else if(k==='kit'){
    body='<div class="stats">'+st('JIBON',pct(J.filter(function(c){return c.kit}).length/J.length))+
      st('Conventional',pct(B.filter(function(c){return c.kit}).length/B.length))+'</div>'+
      '<div class="quote">The single highest-leverage output in the platform. The ambulance is already being '+
      'dispatched — telling the crew what to load costs nothing and changes what treatment is possible on scene. '+
      'The vehicle stops being a taxi and becomes a treatment unit, without buying a single new ambulance.</div>'+
      '<div><div class="eyebrow" style="margin-bottom:8px">Example manifest — unconscious patient</div>'+
      KIT.unconscious.map(function(x){return '<div class="row" style="padding:4px 0;font-size:13px">'+
      '<span class="dot" style="color:'+(x[1]?'var(--red)':'var(--dim)')+'"></span>'+
      '<span style="color:var(--mid)">'+esc(x[0])+'</span></div>'}).join('')+'</div>';
    sheet('Equipment matched to the emergency','Dispatch quality',body);return}
  else if(k==='dispatch'){
    body='<div class="stats">'+st('JIBON median',mins(med(J.map(function(c){return c.dec}))))+
      st('Conventional',mins(med(B.map(function(c){return c.dec}))))+
      st('Recovered',mins(med(B.map(function(c){return c.dec}))-med(J.map(function(c){return c.dec}))))+'</div>'+
      '<div class="quote">The interval AI coordination compresses hardest. A conventional call spends one to two '+
      'minutes on a voice interview before anyone decides what to send. Classification from speech and image '+
      'happens in under a second, so the decision is made while the caller is still talking.</div>';
    sheet('Time to dispatch','Call raised → ambulance assigned',body);return}
  else if(k==='docs'){
    list=act.filter(function(c){return c.mode==='jibon'&&c.doc});title='Clinicians connected'}
  else {list=act;title='Cases'}

  body='<div class="stats">'+st('Cases',list.length)+
    st('Critical',list.filter(function(c){return c.pri==='P1'}).length)+
    st('In transit',list.filter(function(c){return c.stage==='Transporting'}).length)+'</div>'+
    '<div>'+list.slice(0,14).map(caseHTML).join('')+'</div>';
  sheet(title,'Last 30 days · '+list.length+' cases',body);
}

function openCase(id,keep){
  var c=CASES.filter(function(x){return x.id===id})[0];if(!c)return;
  selCase=id;var T=TYPES[c.type];
  sheet(T.i+' '+T.n,c.id+' · '+c.place,
    '<div class="row wrap"><span class="pill '+priCls(c.pri)+'">'+c.pri+' Critical</span>'+
    '<span class="pill nu">'+esc(c.stage)+'</span>'+
    '<span class="pill '+(c.mode==='jibon'?'ok':'nu')+'">'+(c.mode==='jibon'?'JIBON coordinated':'Conventional')+'</span></div>'+
    '<div class="stats">'+st('Call → dispatch',mins(c.dec))+st('To patient',mins(c.resp))+
    st('End to end',mins(c.total))+st('Hospital lead',mins(c.lead))+'</div>'+
    '<div><div class="eyebrow" style="margin-bottom:9px">Emergency brief</div>'+briefRows(c)+'</div>'+
    '<div class="quote"><div class="eyebrow" style="margin-bottom:6px">Caller, verbatim</div>'+esc(c.say)+'</div>'+
    '<div><div class="eyebrow" style="margin-bottom:9px">Route plan</div>'+routeHTML(c)+'</div>'+
    '<div><div class="eyebrow" style="margin-bottom:9px">Equipment manifest</div>'+
    (KIT[c.type]||KIT.other).map(function(k){return '<div class="row" style="padding:4px 0;font-size:13px">'+
      '<span class="dot" style="color:'+(k[1]?'var(--red)':'var(--dim)')+'"></span>'+
      '<span style="color:var(--mid)">'+esc(k[0])+'</span></div>'}).join('')+'</div>'+
    '<div><div class="eyebrow" style="margin-bottom:9px">Hospital preparation — '+esc(HOSP[c.dest].c)+'</div>'+
    (PREP[c.type]||PREP.other).map(function(p){return '<div class="row" style="padding:4px 0;font-size:13px">'+
      '<span class="dot" style="color:'+(p[1]?'var(--red)':'var(--dim)')+'"></span>'+
      '<span style="color:var(--mid)">'+esc(p[0])+'</span></div>'}).join('')+'</div>'+
    '<div><div class="eyebrow" style="margin-bottom:9px">Timeline</div>'+tlHTML(c)+'</div>',keep);
}

function openHosp(id){
  var H=HOSP[id];if(!H)return;
  var inb=CASES.filter(function(c){return c.dest===id});
  var rel=CASES.filter(function(c){return (c.relays||[]).indexOf(id)>=0});
  sheet(H.n,'Tier '+H.t+' · '+H.c,
    '<div class="stats">'+st('Inbound',inb.length)+st('Active',inb.filter(active).length)+
    st('Relay legs',rel.length)+st('Beds',H.beds)+'</div>'+
    '<div><div class="eyebrow" style="margin-bottom:9px">Capabilities</div>'+
    '<div class="row wrap">'+H.cap.map(function(x){return '<span class="pill nu">'+esc(x)+'</span>'}).join('')+'</div></div>'+
    (rel.length?'<div><div class="eyebrow" style="margin-bottom:6px">Relay role</div>'+
      '<p style="font-size:12.5px;color:var(--mid);line-height:1.65">Cases passing through where this facility hands '+
      'supplies and a clinician to the ambulance at the roadside — without admitting the patient. '+
      'The level of care rises during the journey instead of flatlining until arrival.</p></div>':'')+
    '<div><div class="eyebrow" style="margin-bottom:9px">Inbound cases</div>'+
    (inb.filter(active).slice(0,6).map(caseHTML).join('')||'<p style="color:var(--dim);font-size:12.5px">None active.</p>')+'</div>');
}

/* "Why this hospital?" — names the nearer hospital it rejected, and why. */
/* The facility a distance-only dispatcher would have picked. */
function nearerRejected(c){
  var south=['Patuakhali','Barguna','Barishal','Bhola'].indexOf(c.district)>=0;
  var k=c.district==='Patuakhali'?'kuakata-uhc':south?(c.dest==='barishal-smch'?'patuakhali-mch':'barishal-smch')
    :(c.dest==='dhaka-dmch'?'dhaka-nitor':'dhaka-dmch');
  return HOSP[k]}
function whyHosp(id){
  var c=CASES.filter(function(x){return x.id===id})[0];if(!c)return;
  var T=TYPES[c.type],D=HOSP[c.dest];
  var near=nearerRejected(c),lacks=D.cap.filter(function(x){return near.cap.indexOf(x)<0});
  sheet('Why '+D.c+'?','Routing rationale · '+c.id,
    '<div class="quote"><b>'+esc(D.n)+'</b> was chosen because it holds every capability this case needs — '+
    esc(D.cap.slice(0,4).join(', '))+' — at '+(c.transit||52)+' minutes\' travel.</div>'+
    '<div><div class="eyebrow" style="margin-bottom:9px">Nearer option rejected</div>'+
    '<div class="node" data-k="org"><span class="ic">✕</span><span style="flex:1">'+
    '<span class="nm">'+esc(near.n)+'</span>'+
    '<span class="ns">Closer, but lacks '+esc(lacks.length?lacks.slice(0,3).join(', '):T.dept.split(' / ')[0])+'</span></span></div>'+

/* The same rationale, written by the model from the structured routing payload. */
function geminiWhy(id){
  var c=CASES.filter(function(x){return x.id===id})[0];if(!c)return;
  var box=$('#aiwhy');if(box) box.innerHTML='<p style="font-size:12.5px;color:var(--dim)">Gemini is writing the rationale…</p>';
  var payload={question:'Why was this hospital selected?',
    emergency:TYPES[c.type].n,clinical_window_min:TYPES[c.type].w,
    chosen:{name:HOSP[c.dest].n,city:HOSP[c.dest].c,tier:HOSP[c.dest].t,
      capabilities:HOSP[c.dest].cap,travel_min:c.transit||52},
    nearer_rejected:{name:nearerRejected(c).n,
      capabilities:nearerRejected(c).cap,
      lacks:TYPES[c.type].dept},
    relays:(c.relays||[]).map(function(r){return {name:HOSP[r].n,city:HOSP[r].c,capabilities:HOSP[r].cap}})};
  gem([{text:'Routing payload:\n'+JSON.stringify(payload,null,1)}],
    'You explain one JIBON routing recommendation to an ambulance crew who asked why. '+
    'In at most four sentences: state the decisive factor first, cite the concrete figures from the payload, '+
    'explain why the nearer option was rejected, and say what would change the answer. '+
    'Cite only figures present in the payload. No preamble, no markdown, no headings. '+
    'Write as a colleague explaining reasoning, not a system justifying itself. The crew can override at any time.',
    null,900)
  .then(function(t){if(box) box.innerHTML='<div class="quote"><div class="eyebrow" style="margin-bottom:6px">'+
    'Gemini rationale</div>'+esc(t)+'</div>'})
  .catch(function(e){if(box) box.innerHTML='<p style="font-size:12.5px;color:var(--red)">'+esc(e.message)+'</p>'});
}

/* ═══════════════════════════════════════════════════════════════════════════
   GEMINI
   Called straight from the browser with a bring-your-own key. There is no
   server in this build, so there is nowhere a shared secret could safely live;
   each operator supplies their own key from Google AI Studio and it stays in
   their own localStorage. Every AI surface degrades to a local fallback, so the
   venue wifi can never take the demo down.
   ═══════════════════════════════════════════════════════════════════════════ */

var KEY='';
try{KEY=localStorage.getItem('jibon.key')||''}catch(e){}
/* Google retired the 2.5 models for keys created after mid-2026 (the API
   returns 404 and points at gemini-3.6-flash), so that is the default now and
   any 2.5 model still saved in localStorage is migrated on load. */
var DEFAULT_MODEL='gemini-3.6-flash';
var MODELS=['gemini-3.6-flash','gemini-3.7-flash','gemini-3.5-flash-lite','gemini-flash-lite-latest'];
var MODEL=DEFAULT_MODEL;
try{MODEL=localStorage.getItem('jibon.model')||DEFAULT_MODEL;
  if(/^gemini-2[.]5/.test(MODEL)){MODEL=DEFAULT_MODEL;localStorage.setItem('jibon.model',MODEL)}}catch(e){}

function hasKey(){return !!(KEY&&KEY.trim())}
function saveKey(k){KEY=k.trim();try{localStorage.setItem('jibon.key',KEY)}catch(e){}}

/* Structured triage schema. Forcing JSON out of the model is what makes this an
   intake system rather than a chatbot — the output drops straight into a case. */
var TRIAGE_SCHEMA={type:'object',properties:{
  type:{type:'string',enum:Object.keys(TYPES)},
  priority:{type:'string',enum:['P1','P2','P3']},
  summary:{type:'string'},
  reasoning:{type:'string'},
  confidence:{type:'number'},
  consciousness:{type:'string',enum:['alert','voice','pain','unresponsive','unknown']},
  breathing:{type:'string',enum:['normal','laboured','agonal','absent','unknown']},
  patients:{type:'integer'},
  observations:{type:'array',items:{type:'string'}},
  missing_information:{type:'array',items:{type:'string'}},
  image_findings:{type:'string'}
},required:['type','priority','summary','reasoning','confidence','consciousness','breathing','observations','missing_information']};

var TRIAGE_SYS='You are the intake classifier for JIBON, an emergency coordination platform in Bangladesh.\n\n'+
'A bystander is reporting an emergency. They are frightened, not medically trained, and may speak Bangla, '+
'English, or a mix ("Banglish"). They will not use clinical vocabulary. Turn what they said — and any photo — '+
'into a structured emergency profile a dispatcher and clinician can act on immediately.\n\n'+
'Types: '+Object.keys(TYPES).map(function(k){return k+' ('+TYPES[k].n+', '+TYPES[k].w+' min window)'}).join('; ')+'\n\n'+
'Priority: P1 = immediate threat to life. P2 = serious, time-sensitive. P3 = needs care, not immediately life-threatening.\n\n'+
'Rules:\n'+
'- Absent or gasping breathing, unresponsiveness, uncontrolled bleeding and airway burns are P1 without exception.\n'+
'- Report consciousness and breathing as "unknown" unless actually established. Unknown is a useful answer; a guess is not.\n'+
'- If the words and the image disagree, say so in observations and lower your confidence.\n'+
'- summary is one sentence a dispatcher reads aloud, under 140 characters, neutral English.\n'+
'- missing_information lists what the dispatcher must still ask, most clinically important first.\n\n'+
'HARD LIMITS: You are a coordination layer, not a clinician. Never diagnose. Never name or dose a medication. '+
'Never state a medical condition as fact — describe what was reported, what is visible, what it may indicate. '+
'Confidence is a genuine calibrated estimate; do not inflate it. Low confidence that triggers human review is a '+
'correct outcome, not a failure.';

function gem(parts,sys,schema,maxTok){
  if(!hasKey()) return Promise.reject(new Error('no key'));
  /* Gemini 3.x flash models think before answering and the thoughts count
     against maxOutputTokens, so a tiny budget yields an empty reply. Floor it. */
  var body={contents:[{role:'user',parts:parts}],
    generationConfig:{temperature:schema?0.15:0.5,maxOutputTokens:Math.max(maxTok||1200,512),
      thinkingConfig:{thinkingBudget:/pro/.test(MODEL)?128:0}}};
  var ac=window.AbortController?new AbortController():null;
  var to=ac?setTimeout(function(){ac.abort()},20000):null;
  if(sys) body.systemInstruction={parts:[{text:sys}]};
  if(schema){body.generationConfig.responseMimeType='application/json';
    body.generationConfig.responseSchema=schema}
  return fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODEL+
      ':generateContent?key='+encodeURIComponent(KEY),
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ac?ac.signal:undefined})
  .catch(function(e){if(to)clearTimeout(to);throw new Error(e.name==='AbortError'?'Gemini did not answer within 20 s.':'Network error reaching Gemini.')})
  .then(function(r){if(to)clearTimeout(to);
    if(!r.ok) return r.json().catch(function(){return{}}).then(function(j){
      var m={400:'Request rejected — check the model name.',
        401:'Key not accepted. Generate a fresh one in AI Studio.',
        403:'Key cannot reach the Gemini API. Enable the Generative Language API.',
        404:'Model unavailable to this key. Try '+DEFAULT_MODEL+'.',
        429:'Rate limited — wait a moment.',503:'Gemini overloaded.'};
      throw new Error((j.error&&j.error.message)||m[r.status]||('Request failed ('+r.status+')'))});
    return r.json()})
  .then(function(j){
    var cand=(j.candidates&&j.candidates[0])||{};
    var t=((cand.content&&cand.content.parts)||[])
      .map(function(p){return p.text||''}).join('').trim();
    if(!t){
      if(cand.finishReason==='MAX_TOKENS') throw new Error('Gemini ran out of output tokens while thinking — try again or pick a flash-lite model.');
      if(cand.finishReason==='SAFETY') throw new Error('Gemini declined this request (safety filter).');
      throw new Error('Empty response from Gemini.')}
    if(!schema) return t;
    try{return JSON.parse(t.replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,''))}
    catch(e){var a=t.indexOf('{'),b=t.lastIndexOf('}');
      if(a>-1&&b>a) return JSON.parse(t.slice(a,b+1));
      throw new Error('Gemini returned malformed JSON.')}});
}

var REC=null;
function micStart(btn){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Speech input needs Chrome or Edge. You can type instead.');return}
  if(REC)return;
  var base=SAY;
  REC=new SR();REC.lang='bn-BD';REC.continuous=true;REC.interimResults=true;
  btn.textContent='● Listening… release to stop';btn.style.background='var(--red)';btn.style.color='#fff';btn.style.borderColor='var(--red)';

  REC.onerror=function(e){toast(e.error==='not-allowed'?'Microphone permission denied.':'Speech input failed.')};
  REC.onend=function(){REC=null;var b=$('.mic');if(b){b.textContent='🎤 Hold to speak';b.style.background='';b.style.color='';b.style.borderColor=''}};

}

function geoOf(c){var k=Object.keys(GEO).filter(function(n){return (c.place||'').indexOf(n)>=0})[0];
  return GEO[k]||GEO[c.district]||GEO.Dhaka}
function xy(lat,lng){return [((lng-89.6)/1.5)*300+20, 260-((lat-21.5)/2.6)*240]}

      '<text x="'+(q[0]+14)+'" y="'+(q[1]+4)+'" font-size="9.5" font-weight="600" fill="#0d1a16">'+esc(p[2])+'</text>'}).join('')+

function netMap(){

    var n=seen[c.district]=(seen[c.district]||0)+1,a=n*2.1,r=n>1?7+(n%3)*3:0;

      '<circle cx="'+x+'" cy="'+y+'" r="5" fill="'+col+'" stroke="#fff" stroke-width="1.5"/></g>'}).join('');
  var hosp=Object.keys(HOSP).map(function(k){var g=GEO[HOSP[k].c];if(!g)return '';var q=xy(g[0],g[1]);

    '<span><span class="dot" style="color:var(--amber)"></span>P2</span>'+
    '<span><span class="dot" style="color:var(--blue)"></span>P3</span>'+
    '<span><span style="display:inline-block;width:7px;height:7px;border:1.5px solid var(--green);border-radius:2px;margin-right:3px;vertical-align:-1px"></span>Facility</span></span></div>'+
    '<svg viewBox="0 0 340 290" style="width:100%;height:auto;background:var(--tint);border-radius:9px">'+
    Object.keys(GEO).map(function(k){var q=xy(GEO[k][0],GEO[k][1]);
      return '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="2" fill="#cfdad6"/><text x="'+(q[0]+6)+'" y="'+(q[1]+3)+'" font-size="7.5" fill="#9aa8a3">'+esc(k)+'</text>'}).join('')+
    hosp+dots+'</svg></div>';
}

/* Evidence packet — pre-computed figures, not raw rows. This is what keeps the
   model from hallucinating totals: it reasons over arithmetic we did. */
function evidence(){
  var J=jib(),B=base(),act=CASES.filter(active);
  return {window:'30 days',active:act.length,critical_active:act.filter(function(c){return c.pri==='P1'}).length,
    in_transit:act.filter(function(c){return c.stage==='Transporting'}).length,
    coordinated:{cases:J.length,median_call_to_dispatch_min:med(J.map(function(c){return c.dec})),
      median_end_to_end_min:med(J.map(function(c){return c.total})),
      mean_hospital_lead_min:Math.round(avg(J.map(function(c){return c.lead}))),
      equipment_match_rate:+(J.filter(function(c){return c.kit}).length/J.length).toFixed(2)},
    conventional:{cases:B.length,median_call_to_dispatch_min:med(B.map(function(c){return c.dec})),
      median_end_to_end_min:med(B.map(function(c){return c.total})),mean_hospital_lead_min:0,
      equipment_match_rate:+(B.filter(function(c){return c.kit}).length/B.length).toFixed(2)},
    urgent_cases:act.filter(function(c){return c.pri==='P1'}).slice(0,6).map(function(c){
      return {id:c.id,type:TYPES[c.type].n,place:c.place,stage:c.stage,
        window_min:TYPES[c.type].w,elapsed_min:Math.round((Date.now()-c.ts)/60000),
        destination:HOSP[c.dest].n}})};
}

function askAI(){
  if(!ASK.trim()){toast('Type a question first.');return}
  if(!hasKey()){toast('Add a Gemini API key above to use the assistant.');return}
  ANS='Thinking…';draw();
  gem([{text:'Evidence packet:\n'+JSON.stringify(evidence())+'\n\nCoordinator asks: '+ASK}],
    'You are the JIBON operations assistant supporting emergency coordinators in Bangladesh. '+
    'Ground every claim in the evidence packet and never invent a figure. If the packet cannot answer '+
    'something, say precisely what data would be needed. Two to four short paragraphs, direct and specific. '+
    'Never restate the question, never offer further help. You may be asked to draft operational text '+
    '(a dispatch message, a Bangla SMS) — write it directly usable. You are a coordination layer, not a '+
    'clinician: never diagnose, never name a medication.',null,1600)
  .then(function(t){ANS=t;draw()})
  .catch(function(e){ANS='';toast(e.message);draw()});
}

/* ═══════════════════════════════════════════════════════════════════════════
   GUIDED TOUR
   A judge has ninety seconds and no idea which tab matters. Rather than asking
   them to explore, the tour drives itself: it runs the scenario and moves the
   screen to whichever interface is doing something at that moment, narrating
   in plain language. Everything stays clickable throughout.
   ═══════════════════════════════════════════════════════════════════════════ */

var TOUR={on:false,step:0};

var TOUR_STEPS=[
  {at:0.3,view:'citizen',t:'A bystander in Kuakata opens the app',
   s:'They are not a doctor. They tap one icon, or just speak — in Bangla, English, or a mix. No forms, no medical words.'},
  {at:2.2,view:'command',t:'The AI understands in under a second',
   s:'Speech and photo become a structured case: type, priority, what is known, what is still missing. A 999 operator would still be asking questions here.'},
  {at:4.4,view:'ambulance',t:'The ambulance is told what to load',
   s:'Because the emergency is already classified, the crew gets an equipment list before they leave. Today they are dispatched blind and arrive without the one item that mattered.'},
  {at:7.6,view:'patient',t:'A doctor joins — and reads, not asks',
   s:'The clinician enters a session that is already briefed. The bystander never repeats themselves. Green tags mean a human has verified what the AI inferred.'},
  {at:11.6,view:'hospital',t:'Hospitals prepare while the patient is still on the road',
   s:'This is the core idea. The receiving team gets the case, the ETA and a preparation checklist now — not when the doors open.'},
  {at:14.4,view:'ambulance',t:'The relay: care rises during the journey',
   s:'Patuakhali sits on the route to Dhaka. It is told what to have waiting at the roadside and hands up blood and a clinician who continues treatment in the moving vehicle. No new hospital, no new ambulance.'},
  {at:17.4,view:'analytics',t:'What it adds up to',
   s:'Same emergencies, same roads. The only difference is that information moved ahead of the patient.'}
];

function startTour(){
  closeWelcome();
  TOUR.on=true;TOUR.step=0;
  runSim('unconscious');
  TOUR_STEPS.forEach(function(s,i){
    SIM.timers.push(setTimeout(function(){
      if(!TOUR.on)return;
      TOUR.step=i;view=s.view;nav();draw();window.scrollTo(0,0);
    },s.at*1000));
  });
  SIM.timers.push(setTimeout(function(){TOUR.on=false;draw()},19500));
}
function stopTour(){TOUR.on=false;stopSim();draw()}

function tourBar(){
  if(!TOUR.on)return '';
  var s=TOUR_STEPS[TOUR.step];
  return '<div class="tour"><div class="tour__n">'+(TOUR.step+1)+'<span>/'+TOUR_STEPS.length+'</span></div>'+
    '<div class="tour__b"><div class="tour__t">'+esc(s.t)+'</div>'+
    '<div class="tour__s">'+esc(s.s)+'</div></div>'+
    '<button class="btn gho sm" onclick="stopTour()">Exit tour</button></div>';
}

/* ── Welcome ───────────────────────────────────────────────────────────── */
function welcome(){
  var seen=false;try{seen=localStorage.getItem('jibon.seen')==='1'}catch(e){}
  if(seen)return;
  $('#ov').innerHTML='<div class="scrim"></div><div class="wel">'+
    '<div class="wel__b">'+
      '<div class="eyebrow" style="color:var(--green)">জীবন · JIBON</div>'+
      '<h2>Emergency Response Intelligence</h2>'+
      '<p class="wel__lead">Someone collapses in Kuakata. The only person there is a shopkeeper who is not '+
      'medically trained and does not know who to call.</p>'+
      '<p class="wel__lead">Today: one blind phone call, an ambulance dispatched without the right equipment, '+
      'and a hospital that learns about the patient when the doors open. Every handoff throws away what the '+
      'last link knew — and that is paid in minutes that decide whether the patient lives.</p>'+
      '<div class="wel__k"><b>The fix is not more ambulances.</b> The resources already exist. '+
      'What is missing is the information moving fast enough between them.</div>'+
      '<div class="row wrap" style="margin-top:22px">'+
        '<button class="btn pri" style="height:44px;padding:0 22px" onclick="startTour()">▶ Watch the 90-second tour</button>'+
        '<button class="btn gho" style="height:44px" onclick="closeWelcome()">Explore on my own</button>'+
      '</div>'+
      '<p style="font-size:11.5px;color:var(--dim);margin-top:14px">The tour drives itself through all six '+
      'interfaces. Everything stays clickable — you can stop it at any point.</p>'+
    '</div></div>';
}
function closeWelcome(){try{localStorage.setItem('jibon.seen','1')}catch(e){};$('#ov').innerHTML=''}
function reopenWelcome(){try{localStorage.removeItem('jibon.seen')}catch(e){};welcome()}

/* ── Plain-language help per view ──────────────────────────────────────── */
var HELP={
  scenario:['Step through a real emergency','Play, pause, go back a step. The pipeline at the top shows which of the seven coordination phases you are in — everything below it is the case actually changing.'],
  command:['The duty coordinator\'s screen','Every number here opens the cases behind it — nothing is decoration. '+
    'Red means immediate threat to life.'],
  citizen:['What the person at the scene sees','Two seconds to raise an emergency. They tap a picture or speak '+
    'normally — the AI does the interpreting a frightened bystander cannot.'],
  patient:['What a doctor sees on joining','The full case, already assembled. Notice the tag on every line: it '+
    'tells you whether a human confirmed it or the AI inferred it.'],
  ambulance:['What the crew sees before they arrive','Equipment matched to this specific emergency, and a '+
    'destination chosen for what it can treat — not for being nearest.'],
  hospital:['What the receiving hospital sees','The case, the ETA and a preparation checklist while the patient '+
    'is still on the road. In the conventional system this screen is blank until arrival.'],
  cases:['The full dataset','132 emergencies. The recent ones ran through JIBON, the older ones through '+
    'conventional dispatch — which is how the comparison is measured rather than claimed.'],
  analytics:['Does it actually help?','Computed from the dataset above. Same emergencies, same roads, same traffic.'],
  ai:['The Gemini layer','Where the intelligence comes from, and what it is allowed to do.']
};

function helpBar(){
  var h=HELP[view];if(!h)return '';
  return '<div class="help"><span class="help__i">?</span><div><b>'+esc(h[0])+'</b> — '+esc(h[1])+'</div></div>';
}

/* Plain-language glossary. Jargon a judge cannot decode is jargon that costs
   you the explanation you were about to give. */
var GLOSS={
  'P1':'Priority 1 — immediate threat to life. Dispatch now, before anything else.',
  'P2':'Priority 2 — serious and time-sensitive, but not immediately life-threatening.',
  'P3':'Priority 3 — needs care, can safely wait behind P1 and P2 cases.',
  'ALS':'Advanced Life Support — a paramedic crew with a defibrillator, airway kit and cardiac monitoring.',
  'BLS':'Basic Life Support — transport, oxygen and basic first aid only. No paramedic.',
  'Trauma':'A trauma-capable unit — immobilisation, bleeding control and advanced life support.',
  'window':'The clinical window: how long this kind of emergency can wait before survival drops sharply. '+
    'Cardiac arrest is about 8 minutes. Everything on this screen is measured against it.',
  'relay':'A hospital that sits on the route. It is told what to have ready at the roadside and hands supplies '+
    'and a clinician up to the moving ambulance — so treatment escalates during the journey instead of waiting.',
  'lead':'Pre-arrival lead time: how long the receiving hospital had the case before the patient arrived. '+
    'In the conventional chain this is zero by definition.'
};
function gloss(k){
  var g=GLOSS[k];if(!g)return;
  sheet(k==='window'?'Clinical window':k==='relay'?'Relay hospital':k==='lead'?'Pre-arrival lead time':k,
    'Plain English','<p style="font-size:14px;line-height:1.75;color:var(--mid)">'+esc(g)+'</p>');
}

/* ── Boot ──────────────────────────────────────────────────────────────── */
nav();draw();welcome();
</script>
