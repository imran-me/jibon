<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>JIBON — Emergency Response Intelligence</title>
<link rel="icon" href="./assets/mark.svg" type="image/svg+xml"/>
<style>
:root{
  --green:#006a4e; --red:#f42a41; --amber:#b26a00; --blue:#2a6b8f;
  --bg:#fff; --tint:#f6f9f8; --line:#e2e9e6; --line2:#cfdad6;
  --ink:#0d1a16; --mid:#4a5a54; --dim:#7b8a84;
  --r:10px; --sh:0 1px 2px rgba(0,61,45,.05); --sh2:0 12px 32px -12px rgba(0,61,45,.22);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.55 "Inter",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Consolas,monospace}

/* shell */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:20px;
  padding:0 24px;height:60px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand svg{width:28px;height:28px}
.brand b{font-size:16px;letter-spacing:-.02em;display:block;line-height:1.1}
.brand i{font-style:normal;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
nav{display:flex;gap:2px;flex:1;overflow-x:auto}
nav button{padding:7px 13px;border-radius:7px;font-size:13px;color:var(--mid);white-space:nowrap;font-weight:480}
nav button:hover{background:var(--tint);color:var(--ink)}
nav button[data-on="1"]{background:var(--green);color:#fff;font-weight:540}
.live{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);flex:none;
  padding:5px 11px;border:1px solid var(--line);border-radius:99px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--green);animation:p 2s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(0,106,78,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
main{max-width:1400px;margin:0 auto;padding:24px}
.hd{margin-bottom:18px}
.hd h1{font-size:22px;letter-spacing:-.025em}
.hd p{font-size:13px;color:var(--dim);margin-top:3px}

/* pieces */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card h3{font-size:14px;font-weight:560;margin-bottom:2px}
.card .sub{font-size:12px;color:var(--dim);margin-bottom:14px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:1.6fr 1fr}
.g2e{grid-template-columns:1fr 1fr}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.eyebrow{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);font-weight:600}

.kpi{text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:var(--r);
  padding:15px;transition:.15s;box-shadow:var(--sh)}
.kpi:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:var(--sh2)}
.kpi .lab{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:600}
.kpi .val{font-size:30px;font-weight:500;letter-spacing:-.035em;margin:7px 0 3px;line-height:1}
.kpi .hint{font-size:11.5px;color:var(--dim)}
.kpi .go{float:right;color:var(--line2);font-size:15px}
.kpi:hover .go{color:var(--green)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;
  font-size:10.5px;font-weight:600;letter-spacing:.02em}
.p1{background:rgba(244,42,65,.11);color:var(--red)}
.p2{background:rgba(178,106,0,.12);color:var(--amber)}
.p3{background:rgba(42,107,143,.11);color:var(--blue)}
.ok{background:rgba(0,106,78,.11);color:var(--green)}
.nu{background:#eef2f0;color:var(--mid)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.case{display:grid;grid-template-columns:3px 1fr auto;gap:12px;width:100%;text-align:left;
  border:1px solid var(--line);border-radius:9px;overflow:hidden;padding:11px 13px 11px 0;
  background:#fff;transition:.13s;margin-bottom:7px}
.case:hover{border-color:var(--green);background:var(--tint)}
.case .bar{align-self:stretch;border-radius:3px}
.case .t{font-size:13.5px;font-weight:540}
.case .m{font-size:11px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.meter{display:block;height:4px;background:#eef2f0;border-radius:99px;overflow:hidden}
.case .meter{display:inline-block;vertical-align:middle}
.meter i{display:block;height:100%;border-radius:99px;transition:width .5s}

/* timeline */
.tl{max-height:400px;overflow:auto}
.tl li{display:grid;grid-template-columns:16px 1fr;gap:11px;padding:0 0 13px}
.tl .g{display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:5px}
.tl .d{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.tl .ln{width:1px;flex:1;background:var(--line2);min-height:12px}
.tl .tm{font-size:10.5px;color:var(--dim)}
.tl .lb{font-size:13px}
.tl .de{font-size:11.5px;color:var(--dim)}
.tl li.new{animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateX(-8px)}}

/* route */
.node{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);
  border-radius:9px;background:#fff;width:100%;text-align:left;transition:.13s}
.node:hover{border-color:var(--green);background:var(--tint)}
.node .ic{width:28px;height:28px;border-radius:50%;background:var(--tint);display:grid;
  place-items:center;flex:none;color:var(--green);font-size:13px}
.node .nm{font-size:13px;font-weight:520}
.node .ns{font-size:11px;color:var(--dim)}
.node[data-k=relay]{border-left:3px solid var(--amber)}
.node[data-k=dest]{border-left:3px solid var(--green)}
.link{height:22px;margin-left:26px;border-left:2px dashed var(--line2);
  display:flex;align-items:center;padding-left:12px;font-size:10px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}

/* brief */
.br{display:grid;grid-template-columns:128px 1fr;gap:8px 12px;font-size:13px;align-items:baseline}
.br .k{color:var(--dim);font-size:12px}
.br .v{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tag{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:1.5px 6px;
  border-radius:99px;font-weight:600}
.t-rep{background:#eef2f0;color:var(--mid)}
.t-inf{background:rgba(178,106,0,.13);color:var(--amber)}
.t-obs{background:rgba(42,107,143,.12);color:var(--blue)}
.t-ver{background:rgba(0,106,78,.12);color:var(--green)}
.quote{padding:12px;background:var(--tint);border-left:3px solid var(--green);
  border-radius:7px;font-size:13px;line-height:1.65}
.warnbox{padding:12px;border:1px dashed var(--amber);background:rgba(178,106,0,.06);
  border-radius:7px;font-size:12.5px}
.warnbox li{padding-left:15px;position:relative;color:var(--mid);margin-top:3px}
.warnbox li:before{content:"?";position:absolute;left:2px;color:var(--amber);font-weight:700}
.redbox{padding:12px;border:1px dashed var(--red);background:rgba(244,42,65,.05);
  border-radius:7px;font-size:12.5px}
.redbox li{padding-left:15px;position:relative;color:var(--mid);margin-top:3px}
.redbox li:before{content:"×";position:absolute;left:3px;color:var(--red);font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;
  padding:0 16px;border-radius:8px;font-size:13px;font-weight:530;transition:.13s;border:1px solid transparent}
.pri{background:var(--green);color:#fff}
.pri:hover{background:#00563f}
.gho{background:#fff;border-color:var(--line2);color:var(--mid)}
.gho:hover{border-color:var(--green);color:var(--green)}
.dan{background:var(--red);color:#fff}
.dan:hover{background:#d81f35}
.sm{height:29px;padding:0 11px;font-size:12px}

/* emergency grid */
.eg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px}
.et{display:flex;flex-direction:column;gap:9px;padding:16px;min-height:104px;border:1px solid var(--line2);
  border-radius:var(--r);background:#fff;text-align:left;transition:.15s}
.et:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:var(--sh2)}
.et[data-on="1"]{border-color:var(--green);background:rgba(0,106,78,.05);box-shadow:0 0 0 1px var(--green)}
.et .ei{font-size:24px;line-height:1}
.et .en{font-size:13px;font-weight:540;margin-top:auto}
.et .ew{font-size:10.5px;color:var(--dim)}

/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  padding:9px 12px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--tint)}
.rt{text-align:right}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(11,32,26,.4);z-index:90;backdrop-filter:blur(3px)}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:#fff;z-index:100;
  box-shadow:var(--sh2);display:flex;flex-direction:column;animation:sl .28s cubic-bezier(.2,0,0,1)}
@keyframes sl{from{transform:translateX(100%)}}
.sheet header{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px}
.sheet header h2{font-size:19px;letter-spacing:-.02em}
.sheet .body{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:20px}
.sheet .x{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);font-size:17px;color:var(--mid);flex:none}
.sheet .x:hover{border-color:var(--red);color:var(--red)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.st{background:#fff;padding:11px 13px}
.st .l{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);font-weight:600}
.st .v{font-size:17px;font-weight:540;letter-spacing:-.02em;margin-top:2px}
.st .s{font-size:11px;color:var(--dim)}

.banner{display:flex;align-items:center;gap:14px;padding:14px 18px;border:1px solid var(--green);
  background:rgba(0,106,78,.05);border-radius:var(--r);margin-bottom:18px}
.banner .cap{flex:1;font-size:13.5px;font-weight:520}
.banner .pg{width:130px;flex:none}

.toast{position:fixed;bottom:22px;right:22px;z-index:150;background:var(--ink);color:#fff;
  padding:12px 17px;border-radius:9px;font-size:13px;box-shadow:var(--sh2);animation:in .3s;max-width:360px}

.bars{display:flex;flex-direction:column;gap:9px}
.bars .b{display:grid;grid-template-columns:1fr auto;gap:4px 12px;width:100%;text-align:left;
  padding:5px 6px;border-radius:6px}
.bars .b:hover{background:var(--tint)}
.bars .bl{font-size:12.5px;color:var(--mid)}
.bars .bv{font-size:12.5px}
.bars .bt{grid-column:1/-1}

.cmp{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:9px;overflow:hidden}
.cmp div{background:#fff;padding:10px 13px;font-size:12.5px;display:flex;align-items:center}
.cmp .h{background:var(--tint);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.cmp .r{justify-content:flex-end}
.cmp .win{color:var(--green);font-weight:600}
@media(max-width:1000px){.g2,.g2e{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#006a4e"/>
    <path d="M6 12h2.7l1.4-2.8 2.2 5.4L13.7 12h4.3" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span><b>JIBON</b><i>জীবন · emergency response</i></span>
  </div>
  <nav id="nav"></nav>
  <div class="live"><span class="pulse"></span><span id="livetxt">System nominal</span></div>
</header>

<main id="app"></main>
<div id="ov"></div>
<div id="tst"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   JIBON — Emergency Response Intelligence
   Single file, zero dependencies. Runs from file:// or any static host.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── Reference data ────────────────────────────────────────────────────── */

var TYPES = {
  cardiac:{n:'Cardiac Emergency',i:'🫀',w:8,dept:'Cardiology / CCU',cap:'ALS'},
  unconscious:{n:'Unconscious Person',i:'🧍',w:10,dept:'Emergency Medicine',cap:'ALS'},
  trauma:{n:'Road Accident',i:'🚗',w:60,dept:'Trauma / Orthopaedics',cap:'Trauma'},
  bleeding:{n:'Severe Bleeding',i:'🩸',w:15,dept:'Emergency Surgery',cap:'Trauma'},
  breathing:{n:'Breathing Problem',i:'🫁',w:12,dept:'Emergency Medicine',cap:'ALS'},
  stroke:{n:'Stroke Symptoms',i:'🧠',w:270,dept:'Neurology / Stroke Unit',cap:'ALS'},
  obstetric:{n:'Childbirth',i:'👶',w:30,dept:'Obstetrics',cap:'Obstetric'},
  burn:{n:'Burn Injury',i:'🔥',w:45,dept:'Burn Unit',cap:'Trauma'},
  poisoning:{n:'Poisoning',i:'☠️',w:30,dept:'Toxicology',cap:'ALS'},
  fire:{n:'Fire',i:'🔥',w:20,dept:'Burn Unit',cap:'Fire'},
  police:{n:'Police / Violence',i:'🛡️',w:20,dept:'Emergency Medicine',cap:'Police'},
  other:{n:'Other Emergency',i:'⚠️',w:60,dept:'Emergency Medicine',cap:'BLS'}
};

var HOSP = {
  'kuakata-uhc':{n:'Kuakata Upazila Health Complex',c:'Kuakata',t:1,beds:50,cap:['Emergency','Obstetric']},
  'patuakhali-mch':{n:'Patuakhali Medical College Hospital',c:'Patuakhali',t:2,beds:250,cap:['Emergency','Theatre','ICU','CT','Blood bank']},
  'barishal-smch':{n:'Sher-e-Bangla Medical College',c:'Barishal',t:3,beds:1000,cap:['Emergency','Theatre','ICU','CCU','CT','Trauma','Blood bank','Ventilator']},
  'dhaka-dmch':{n:'Dhaka Medical College Hospital',c:'Dhaka',t:4,beds:2600,cap:['Emergency','Theatre','ICU','CCU','CT','MRI','Trauma','Neurosurgery','Stroke unit','Blood bank']},
  'dhaka-nitor':{n:'NITOR (Pangu Hospital)',c:'Dhaka',t:4,beds:500,cap:['Emergency','Theatre','ICU','CT','Trauma','Orthopaedics']},
  'dhaka-nicvd':{n:'National Institute of Cardiovascular Diseases',c:'Dhaka',t:4,beds:650,cap:['Emergency','Theatre','ICU','CCU','Cath lab','Blood bank']}
};

/* Equipment manifests — the highest-leverage output. The ambulance is going
   anyway; telling the crew what to load costs nothing and changes outcomes. */
var KIT = {
  unconscious:[['Airway management kit',1],['Oxygen + bag-valve mask',1],['Blood glucose meter',1],['Vitals monitor with SpO₂',1],['Defibrillator',0],['Cervical collar',0]],
  cardiac:[['Defibrillator / AED',1],['Advanced airway kit',1],['Oxygen + bag-valve mask',1],['12-lead ECG monitor',1],['IV access and fluids',0]],
  trauma:[['Tourniquets + haemostatic packing',1],['Spinal board + cervical collar',1],['Limb / traction splints',1],['Large-bore IV + fluids',1],['Oxygen',1],['Extrication tools',0]],
  bleeding:[['Tourniquets + haemostatic dressings',1],['Large-bore IV + fluids',1],['Oxygen',1],['Warming blanket',0]],
  breathing:[['High-flow oxygen',1],['Nebuliser',1],['Airway kit + suction',1],['Pulse oximeter',1]],
  stroke:[['Vitals monitor with SpO₂',1],['Blood glucose meter',1],['Stroke assessment scale',1],['IV access',0]],
  other:[['Standard response kit',1],['Oxygen',0],['Vitals monitor',0]]
};

/* Hospital preparation — a checklist the receiving team confirms, never an order. */
var PREP = {
  unconscious:[['Resuscitation bay cleared',1],['CT scanner slot held',1],['Intubation kit + anaesthetist alerted',1],['Point-of-care glucose + electrolytes',1],['ICU bed provisionally held',0],['Toxicology screen if cause unknown',0]],
  cardiac:[['CCU bed + cardiac monitoring',1],['Cath lab team on standby for primary PCI',1],['ECG ready at the door',1],['Crash trolley at receiving bay',1],['Cardiac enzyme panel pre-ordered',0]],
  trauma:[['Trauma team activation',1],['Resus bay with rapid infuser',1],['Cross-match + O-negative on standby',1],['CT trauma series slot held',1],['Emergency theatre on standby',1],['ICU bed provisionally held',0]],
  bleeding:[['Massive transfusion protocol',1],['Emergency theatre on standby',1],['Resus bay + rapid infuser',1],['On-call surgeon alerted',1]],
  breathing:[['Resus bay with high-flow oxygen',1],['Nebuliser + bronchodilators',1],['Ventilator + ICU bed on standby',1]],
  stroke:[['Stroke team activation — clock running',1],['CT cleared for immediate scan',1],['Thrombolysis pathway prepared',1],['Coagulation + glucose pre-ordered',1]],
  other:[['ED bay assigned',1],['Senior triage nurse to assess',1]]
};

/* Bystander guidance — published lay first-aid steps only. Reviewable, static.
   The AI selects which protocol applies; it never authors one. */
var AID = {
  unconscious:{h:'Check breathing first. That single answer changes everything that follows.',
    s:['Check the area is safe, then tap their shoulders and shout their name.',
       'Tilt the head back gently and lift the chin to open the airway.',
       'Look at the chest and listen for breath for ten seconds.',
       'If breathing normally, roll them onto their side, head tilted back.',
       'If not breathing normally, start chest compressions — hard and fast, centre of the chest.',
       'Stay on the line. Keep the camera on them so we can watch for change.'],
    x:['Do not put anything in their mouth.','Do not move them if they may have fallen from height.','Do not splash water on their face.']},
  cardiac:{h:'Start chest compressions if they are not responding and not breathing normally.',
    s:['Check the area is safe before you approach.','Shout for help; ask someone to find a defibrillator.',
       'Heel of your hand in the centre of the chest, other hand on top.',
       'Push hard and fast — about twice per second, let the chest rise fully.',
       'Do not stop to check for a pulse. Continue until a responder takes over.',
       'Keep this line open — the doctor joining can count the rhythm with you.'],
    x:['Do not give food, water or any medicine.','Do not leave the person alone to look for help.']},
  trauma:{h:'Control visible bleeding. Do not move them unless they are in immediate danger.',
    s:['Check for traffic, fire, fuel or live wires before approaching.',
       'Press firmly and continuously on heavy bleeding with the cleanest cloth available.',
       'Keep their head and neck still and in line with the body.',
       'Talk to them and note whether they answer — responders will ask you this.',
       'Cover them to keep them warm.','Keep the line open; point the camera at injuries when asked.'],
    x:['Do not remove any embedded object.','Do not give food or water — surgery may be needed.','Do not sit them up or drag them by the arms.']},
  bleeding:{h:'Direct, firm, continuous pressure. Do not release to check.',
    s:['Press hard directly on the wound with the cleanest cloth you have.',
       'If blood soaks through, add more on top — do not remove what is there.',
       'If a limb is bleeding heavily, apply a tight band well above the wound and note the time.',
       'Lay the person down and raise their legs slightly.','Keep them warm and keep talking to them.',
       'Stay on the line — tell us if they become pale, cold or stop answering.'],
    x:['Do not wash a deep wound.','Do not remove embedded objects.','Do not give anything to drink.']},
  other:{h:'Keep the person safe and stay with them until help arrives.',
    s:['Check the area is safe for you.','Stay with the person and keep them calm.',
       'Do not move them unless they are in danger where they are.',
       'Watch their breathing and whether they stay responsive.','Keep them warm.','Stay on the line.'],
    x:['Do not give medication.','Do not leave them alone.']}
};
AID.breathing=AID.other; AID.stroke=AID.other; AID.burn=AID.other;
AID.poisoning=AID.other; AID.obstetric=AID.other; AID.fire=AID.other; AID.police=AID.other;
KIT.burn=KIT.trauma; KIT.poisoning=KIT.other; KIT.obstetric=KIT.other;
KIT.fire=KIT.other; KIT.police=KIT.other;
PREP.burn=PREP.trauma; PREP.poisoning=PREP.other; PREP.obstetric=PREP.other;
PREP.fire=PREP.other; PREP.police=PREP.other;

var PLACES=[
  ['Kuakata beach road','Patuakhali'],['Kalapara bazar','Patuakhali'],['Patuakhali town','Patuakhali'],
  ['Barguna town','Barguna'],['Barishal city','Barishal'],['Bhola sadar','Bhola'],
  ['Padma Bridge approach','Munshiganj'],['Mirpur 10, Dhaka','Dhaka'],['Gulshan Avenue, Dhaka','Dhaka'],
  ['Jatrabari crossing, Dhaka','Dhaka'],['Faridpur bypass','Faridpur'],['Gopalganj highway','Gopalganj']
];

var SAYS={
  unconscious:['Uni hothat pore gechen, dak dile sara dicchen na. Nishash nicchen kina bujhte parchi na. Ekhane kono doctor nai.',
    'একজন লোক অজ্ঞান হয়ে পড়ে আছে, ডাকলে সাড়া দিচ্ছে না। কী করব বুঝতে পারছি না।'],
  cardiac:['একজন হঠাৎ বুকে ব্যথা বলে পড়ে গেছেন, এখন সাড়া দিচ্ছেন না।',
    'Ekjon lok buke hat diye pore gechen, dak dile utthen na.'],

};
SAYS.burn=SAYS.other;SAYS.poisoning=SAYS.other;SAYS.obstetric=SAYS.other;SAYS.fire=SAYS.other;SAYS.police=SAYS.other;

var DOCS=['Dr. N. Akter','Dr. A. Rahman','Dr. S. Chowdhury','Dr. T. Hossain','Dr. F. Begum'];
var VOLS=['H. Sultana (off-duty nurse)','S. Mahmud (nursing student)','J. Uddin (trained first aider)'];

/* ── Seeded generator ──────────────────────────────────────────────────────
   Fixed seed so every reload and every laptop shows identical numbers. A demo
   that changes under the judges is a demo you cannot rehearse.               */
var _s=987654321;
function rnd(){_s=(_s*1103515245+12345)&0x7fffffff;return _s/0x7fffffff}
function pick(a){return a[Math.floor(rnd()*a.length)]}
function ri(a,b){return Math.floor(a+rnd()*(b-a+1))}

var TKEYS=Object.keys(TYPES);
var CASES=[],seq=4200;

function routeFor(district,type){
  /* Capability-based destination, not nearest. A closer hospital that cannot
     operate is not a destination — it is a delay. */
  var south=['Patuakhali','Barguna','Barishal','Bhola'].indexOf(district)>=0;
  var dest = type==='cardiac' ? 'dhaka-nicvd'
           : type==='trauma' ? (south?'barishal-smch':'dhaka-nitor')
           : south ? 'barishal-smch' : 'dhaka-dmch';
  var relays=[];
  if(district==='Patuakhali'&&dest!=='patuakhali-mch') relays.push('patuakhali-mch');
  if(south&&dest.indexOf('dhaka')===0) relays.push('barishal-smch');
  return {dest:dest,relays:relays};
}

function makeCase(minsAgo,mode){
  var t=pick(TKEYS),pl=pick(PLACES);
  var pr = (t==='cardiac'||t==='unconscious'||t==='trauma'||t==='bleeding')
    ? (rnd()<0.75?'P1':'P2') : (rnd()<0.5?'P2':'P3');
  var jib = mode==='jibon';
  var dec = jib ? +(0.4+rnd()*0.7).toFixed(1) : +(3+rnd()*4).toFixed(1);
  var resp= +(9+rnd()*16).toFixed(0);
  var kit = jib ? rnd()>0.06 : rnd()>0.62;
  var scene=jib?ri(5,10):ri(12,22);
  var transit=ri(25,90);
  var total=dec+resp+scene+transit;
  var r=routeFor(pl[1],t);
  var done=minsAgo>total+30;
  var stage= done?'Closed': minsAgo>dec+resp+scene?'Transporting': minsAgo>dec+resp?'On scene': minsAgo>dec?'Dispatched':'Classified';
  seq++;
  return {
    id:'EMG-'+seq,type:t,pri:pr,stage:stage,mode:mode,place:pl[0],district:pl[1],
    ts:Date.now()-minsAgo*60000,dec:dec,resp:resp,scene:scene,transit:transit,total:total,
    kit:kit,conf:+((jib?0.86:0.68)+rnd()*0.11).toFixed(2),
    patients:t==='trauma'&&rnd()<0.35?ri(2,4):1,
    unit:(kit?TYPES[t].cap.toUpperCase().slice(0,3):'BLS')+'-'+ri(100,160),
    doc:jib?pick(DOCS):null, vol:jib&&rnd()<0.6?pick(VOLS):null,
    dest:r.dest,relays:r.relays,
    lead: jib?Math.round(transit*0.8+scene):0,
    say:pick(SAYS[t]||SAYS.other),
    prep: jib?(done?'Received':(rnd()<0.5?'Team ready':'Preparing')):'Not notified',
    tl:null,sim:false
  };
}
/* Last 7 days coordinated, the 3 weeks before it conventional — so the
   before/after comparison is computed from data, not asserted. */
/* A coordinator never opens an empty board. Seed cases still in flight so
   the KPIs, transit units and preparing hospitals are live on first paint. */
for(var i=0;i<7;i++) CASES.push(makeCase(ri(3,95),'jibon'));
for(var i=0;i<58;i++) CASES.push(makeCase(ri(2,10000),'jibon'));
for(var i=0;i<74;i++) CASES.push(makeCase(ri(10100,43000),'baseline'));
CASES.sort(function(a,b){return b.ts-a.ts});

/* ── Helpers ───────────────────────────────────────────────────────────── */
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function mins(m){if(m==null||isNaN(m))return '—';
  if(m<1)return Math.round(m*60)+'s';if(m<60)return (m<10?m.toFixed(1):Math.round(m))+' min';
  return Math.floor(m/60)+'h '+Math.round(m%60)+'m'}
function ago(ts){var m=(Date.now()-ts)/60000;
  if(m<60)return Math.round(m)+'m ago';if(m<1440)return Math.round(m/60)+'h ago';
  return Math.round(m/1440)+'d ago'}
function clock(ts){var d=new Date(ts);
  return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function pct(x){return Math.round(x*100)+'%'}
function priCls(p){return p==='P1'?'p1':p==='P2'?'p2':'p3'}
function priColor(p){return p==='P1'?'var(--red)':p==='P2'?'var(--amber)':'var(--blue)'}
function active(c){return c.stage!=='Closed'}
function jib(){return CASES.filter(function(c){return c.mode==='jibon'})}
function base(){return CASES.filter(function(c){return c.mode==='baseline'})}
function med(a){if(!a.length)return null;var s=a.slice().sort(function(x,y){return x-y});
  return s[Math.floor(s.length/2)]}
function avg(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:0}
function toast(m){var t=$('#tst');t.innerHTML='<div class="toast">'+esc(m)+'</div>';
  clearTimeout(window._tt);window._tt=setTimeout(function(){t.innerHTML=''},4200)}

/* ── KPI computation ───────────────────────────────────────────────────── */
function kpis(){
  var act=CASES.filter(active), J=jib(), B=base();
  return [
    ['active','Active emergencies',act.length,'Open cases — reported through to transporting'],
    ['critical','Critical (P1)',act.filter(function(c){return c.pri==='P1'}).length,'Immediate threat to life, still open'],
    ['transit','Units in transit',act.filter(function(c){return c.stage==='Transporting'}).length,'Ambulances carrying a patient now'],
    ['dispatch','Time to dispatch',mins(med(J.map(function(c){return c.dec}))),'Median from call raised to ambulance assigned'],
    ['hosp','Hospitals preparing',new Set(act.filter(function(c){return c.mode==='jibon'}).map(function(c){return c.dest})).size,'Facilities readying resources for an inbound case'],
    ['lead','Pre-arrival lead',mins(avg(J.map(function(c){return c.lead}))),'How long the hospital had the case before arrival'],
    ['kit','Equipment matched',pct(J.filter(function(c){return c.kit}).length/Math.max(1,J.length)),'Ambulances loaded for the actual emergency'],
    ['docs','Clinicians connected',new Set(J.filter(function(c){return c.doc}).map(function(c){return c.doc})).size,'Doctors who joined a live emergency session']
  ];
}

    '</button>';

function vCommand(){

/* ── The scenario engine ───────────────────────────────────────────────────
   Drives a genuine case record through the genuine state machine at
   compressed speed. The interfaces are reacting to a case that is really
   changing — nothing here is a canned animation.                            */
var SIM={on:false,id:null,cap:'',i:0,n:0,timers:[]};

function runSim(type){
  stopSim();
  seq++;
  var pl = type==='trauma'?['Padma Bridge approach','Munshiganj']:['Kuakata beach road','Patuakhali'];
  var r=routeFor(pl[1],type);
  var c={id:'EMG-'+seq,type:type,pri:'P1',stage:'Reported',mode:'jibon',place:pl[0],district:pl[1],
    ts:Date.now(),dec:null,resp:null,scene:null,transit:null,total:null,kit:true,conf:type==='trauma'?0.88:0.91,
    patients:type==='trauma'?3:1,unit:null,doc:null,vol:null,dest:r.dest,relays:r.relays,lead:0,
    say:SAYS[type][0],prep:'Not notified',sim:true,
    tl:[{t:Date.now(),l:'Emergency reported',d:'Voice channel opened — Kuakata',a:'citizen'}],
    facts:[['Consciousness',type==='trauma'?'Responds to voice':'Unresponsive','rep'],
           ['Breathing','Unknown — caller cannot confirm','rep']],
    missing:['Is the chest rising?','Was there a fall or a blow to the head?','Any known heart condition?']};
  CASES.unshift(c);
  SIM.on=true;SIM.id=c.id;SIM.i=0;

  var S=[
    [0.3,'AI parsing the caller\'s speech',function(){
      log(c,'Voice channel active','Continuous session — the caller never repeats themselves','sys')}],
    [1.2,'Classified '+TYPES[type].n+' · P1',function(){
      c.stage='Classified';
      log(c,'AI classified as critical — '+TYPES[type].n,
        'Unresponsive with unconfirmed breathing is treated as P1 until breathing is established','ai')}],
    [2.2,'Destination chosen by capability; relay identified',function(){
      log(c,'Destination set — '+HOSP[c.dest].n,
        c.relays.length?'Relay prepared at '+c.relays.map(function(h){return HOSP[h].c}).join(' and '):'Direct transfer','ai')}],
    [3.2,'Ambulance dispatched with a matched equipment manifest',function(){
      c.stage='Dispatched';c.dec=0.8;c.unit=type==='trauma'?'TRA-118':'ALS-142';
      log(c,'Ambulance '+c.unit+' dispatched','Loaded for '+TYPES[type].n.toLowerCase()+' — manifest sent before departure','amb')}],
    [4.4,'Emergency physician joined the open session',function(){
      c.doc='Dr. N. Akter';
      log(c,'Dr. N. Akter joined the session','Read the brief on entry — no re-interview of the caller','doc')}],
    [5.4,'Bystander receiving guided first aid',function(){
      log(c,'First-aid guidance started','Doctor guiding the bystander through the protocol on the open line','doc')}],
    [6.4,'Nearby trained volunteer notified',function(){
      c.vol='H. Sultana (off-duty nurse)';
      log(c,'Volunteer H. Sultana notified','Off-duty nurse, four minutes away on foot','vol')}],
    [7.6,'Clinician verified the AI assessment',function(){
      c.verified=true;c.facts[0][2]='ver';
      log(c,'Case verified by Dr. N. Akter','AI inferences confirmed by a qualified clinician','doc')}],
    [8.8,'Volunteer reached the patient before the ambulance',function(){
      c.facts[1]=['Breathing',type==='trauma'?'Laboured':'Agonal / gasping','ver'];
      c.missing=c.missing.slice(1);
      log(c,'Volunteer reached the patient','Breathing confirmed from the scene — brief updated','vol')}],
    [10.2,'Crew on scene, treatment started',function(){
      c.stage='On scene';c.resp=14;
      log(c,'Crew reached the patient','Arrived with the equipment this case actually needed','amb')}],
    [11.6,'Patient loaded, transport begun',function(){
      c.stage='Transporting';c.scene=7;c.prep='Preparing';
      log(c,'Departed for '+HOSP[c.dest].n,'Receiving team notified and preparing','amb')}],
    [13,'Relay hospital standing by at the roadside',function(){
      if(c.relays.length) log(c,HOSP[c.relays[0]].c+' team ready at the roadside',
        'Blood, fluids and a clinician prepared to join the vehicle','hos')}],
    [14.4,'Relay rendezvous — care level raised in transit',function(){
      if(c.relays.length) log(c,'Rendezvous at '+HOSP[c.relays[0]].c,
        'Supplies transferred and a clinician joined the ambulance — no admission, journey continued','hos')}],
    [15.8,'Receiving hospital team assembled',function(){
      c.prep='Team ready';
      log(c,HOSP[c.dest].n+' — team ready',TYPES[type].dept+' standing by, theatre and blood confirmed','hos')}],
    [17.2,'Handover complete — treatment began at the door',function(){
      c.stage='Transporting';c.prep='Received';c.lead=46;c.transit=52;c.total=74;
      log(c,'Handed over at '+HOSP[c.dest].n,'Team already assembled — assessment did not restart','hos');
      SIM.on=false;toast('Scenario complete. Hospital had the case 46 minutes before arrival.')}]
  ];
  SIM.n=S.length;
  S.forEach(function(s,i){
    SIM.timers.push(setTimeout(function(){
      if(SIM.id!==c.id)return;
      s[2]();SIM.cap=s[1];SIM.i=i+1;
      if(i===S.length-1)SIM.on=false;
      refresh();
    },s[0]*1000));
  });
  go('command');
  toast('Scenario started — watch the timeline build.');
}
function log(c,l,d,a){c.tl.push({t:Date.now(),l:l,d:d,a:a})}
function stopSim(){SIM.timers.forEach(clearTimeout);SIM.timers=[];SIM.on=false;SIM.id=null;refresh()}

}

function tlHTML(c){

    {t:c.ts+(c.dec+1)*60000,l:'Ambulance '+c.unit+' dispatched',d:c.kit?'Equipment matched to the case':'Nearest available unit',a:'amb'},

    {t:c.ts+c.total*60000,l:'Handed over at '+HOSP[c.dest].n,d:c.mode==='jibon'?'Team was standing by':'Assessment began on arrival',a:'hos'}];

/* ── View: Analytics ───────────────────────────────────────────────────── */
function vAnalytics(){
  var J=jib(),B=base();
  var rows=[
    ['Call → dispatch',med(J.map(function(c){return c.dec})),med(B.map(function(c){return c.dec})),1],
    ['Time on scene',med(J.map(function(c){return c.scene})),med(B.map(function(c){return c.scene})),1],
    ['End to end',med(J.map(function(c){return c.total})),med(B.map(function(c){return c.total})),1],
    ['Hospital lead time',avg(J.map(function(c){return c.lead})),0,0]
  ];
  var byT={};CASES.forEach(function(c){byT[c.type]=(byT[c.type]||0)+1});
  var tl=Object.keys(byT).map(function(k){return[k,byT[k]]}).sort(function(a,b){return b[1]-a[1]});
  var mx=Math.max.apply(null,tl.map(function(x){return x[1]}));
  var savedPer=(med(B.map(function(c){return c.total}))-med(J.map(function(c){return c.total})));

  return '<div class="hd"><h1>Impact</h1><p>Computed from the dataset — the same emergencies, the same roads</p></div>'+
  '<div class="grid g4" style="margin-bottom:16px">'+
    '<div class="card"><div class="lab eyebrow">Minutes saved per case</div>'+
    '<div style="font-size:32px;font-weight:500;letter-spacing:-.03em;color:var(--green);margin-top:6px">'+
    Math.round(savedPer)+'</div><div class="hint" style="font-size:11.5px;color:var(--dim)">median, end to end</div></div>'+
    '<div class="card"><div class="lab eyebrow">Dispatch decision</div>'+
    '<div style="font-size:32px;font-weight:500;letter-spacing:-.03em;color:var(--green);margin-top:6px">'+
    Math.round((1-med(J.map(function(c){return c.dec}))/med(B.map(function(c){return c.dec})))*100)+'%</div>'+
    '<div class="hint" style="font-size:11.5px;color:var(--dim)">faster than conventional</div></div>'+
    '<div class="card"><div class="lab eyebrow">Hospital lead time</div>'+
    '<div style="font-size:32px;font-weight:500;letter-spacing:-.03em;color:var(--green);margin-top:6px">'+
    Math.round(avg(J.map(function(c){return c.lead})))+' min</div>'+
    '<div class="hint" style="font-size:11.5px;color:var(--dim)">was zero — hospital learned at the door</div></div>'+
    '<div class="card"><div class="lab eyebrow">Equipment matched</div>'+
    '<div style="font-size:32px;font-weight:500;letter-spacing:-.03em;color:var(--green);margin-top:6px">'+
    pct(J.filter(function(c){return c.kit}).length/J.length)+'</div>'+
    '<div class="hint" style="font-size:11.5px;color:var(--dim)">from '+pct(B.filter(function(c){return c.kit}).length/B.length)+' conventionally</div></div>'+
  '</div>'+
  '<div class="grid g2">'+
    '<div class="card"><h3>Where the time goes</h3>'+
    '<div class="sub">Median minutes per stage, conventional vs coordinated</div>'+
    rows.map(function(r){
      var m=Math.max(r[1],r[2],1);
      return '<div style="margin-bottom:14px"><div class="row between" style="font-size:12.5px;margin-bottom:5px">'+
      '<span style="color:var(--mid)">'+esc(r[0])+'</span>'+
      '<span class="num"><span style="color:var(--dim)">'+mins(r[2])+'</span> → '+
      '<b style="color:var(--green)">'+mins(r[1])+'</b></span></div>'+
      '<div class="meter" style="height:7px;margin-bottom:3px"><i style="width:'+(r[2]/m*100)+'%;background:var(--line2)"></i></div>'+
      '<div class="meter" style="height:7px"><i style="width:'+(r[1]/m*100)+'%;background:var(--green)"></i></div></div>'}).join('')+
    '<p style="font-size:11.5px;color:var(--dim)">Grey is conventional dispatch. Green is JIBON. '+
    'Road time is identical in both — the platform does not change physics, only what is known before the wheels turn.</p></div>'+
    '<div class="card"><h3>Case mix</h3><div class="sub">Click a type to see those cases</div><div class="bars">'+
    tl.map(function(t){return '<button class="b" onclick="filterType(\''+t[0]+'\')">'+
      '<span class="bl">'+TYPES[t[0]].i+' '+esc(TYPES[t[0]].n)+'</span><span class="bv num">'+t[1]+'</span>'+
      '<span class="bt meter"><i style="width:'+(t[1]/mx*100)+'%;background:var(--green)"></i></span></button>'}).join('')+
    '</div></div>'+
  '</div>'+
  '<div class="card" style="margin-top:14px;border-left:3px solid var(--green)">'+
  '<h3>What we can honestly claim</h3>'+
  '<p style="font-size:13px;color:var(--mid);line-height:1.7;margin-top:8px">'+
  'Time is the dominant variable in emergency survival, and this attacks time at four separate points: '+
  '<b>recognition, routing, equipment, and destination readiness</b>. Cardiac arrest survival falls roughly '+
  '7–10% for every minute without intervention. On this dataset the coordinated model recovers a median of '+
  '<b>'+Math.round(savedPer)+' minutes per case</b> and gives the receiving hospital <b>'+
  Math.round(avg(J.map(function(c){return c.lead})))+' minutes</b> of preparation it previously had none of.<br><br>'+
  'None of it requires a new ambulance, a new theatre or a new doctor. '+
  '<b>The resources already exist — only the information was missing.</b></p></div>';
}

}
function closeSheet(){$('#ov').innerHTML='';selCase=null}

function drill(k){
  var act=CASES.filter(active),J=jib(),B=base(),list,title,body='';
  if(k==='active'){list=act;title='Active emergencies'}
  else if(k==='critical'){list=act.filter(function(c){return c.pri==='P1'});title='Critical cases (P1)'}
  else if(k==='transit'){list=act.filter(function(c){return c.stage==='Transporting'});title='Units in transit'}
  else if(k==='hosp'){
    var by={};act.filter(function(c){return c.mode==='jibon'}).forEach(function(c){(by[c.dest]=by[c.dest]||[]).push(c)});
    body='<div class="stats">'+st('Facilities',Object.keys(by).length)+
      st('Inbound cases',act.filter(function(c){return c.mode==='jibon'}).length)+'</div>'+
      Object.keys(by).map(function(h){return '<button class="node" onclick="openHosp(\''+h+'\')">'+
        '<span class="ic">🏥</span><span style="flex:1"><span class="nm">'+esc(HOSP[h].n)+'</span>'+
        '<span class="ns">'+esc(HOSP[h].c)+' · '+by[h].length+' inbound</span></span>'+
        '<span class="pill ok">Preparing</span></button>'}).join('');
    sheet('Hospitals preparing','Live readiness',body);return}
  else if(k==='lead'){
    body='<div class="stats">'+st('Mean lead',mins(avg(J.map(function(c){return c.lead}))))+
      st('Conventional','0 min','zero by definition')+
      st('Best case',mins(Math.max.apply(null,J.map(function(c){return c.lead}))))+'</div>'+
      '<div class="quote">In the conventional chain this number is zero: the hospital learns about the patient '+
      'when the ambulance doors open. Every minute here is preparation that used to happen after arrival — '+
      'the theatre, the blood cross-match, the specialist team.</div>';
    sheet('Pre-arrival lead time','How long the hospital had the case',body);return}
  else if(k==='kit'){
    body='<div class="stats">'+st('JIBON',pct(J.filter(function(c){return c.kit}).length/J.length))+
      st('Conventional',pct(B.filter(function(c){return c.kit}).length/B.length))+'</div>'+
      '<div class="quote">The single highest-leverage output in the platform. The ambulance is already being '+
      'dispatched — telling the crew what to load costs nothing and changes what treatment is possible on scene. '+
      'The vehicle stops being a taxi and becomes a treatment unit, without buying a single new ambulance.</div>'+
      '<div><div class="eyebrow" style="margin-bottom:8px">Example manifest — unconscious patient</div>'+
      KIT.unconscious.map(function(x){return '<div class="row" style="padding:4px 0;font-size:13px">'+
      '<span class="dot" style="color:'+(x[1]?'var(--red)':'var(--dim)')+'"></span>'+
      '<span style="color:var(--mid)">'+esc(x[0])+'</span></div>'}).join('')+'</div>';
    sheet('Equipment matched to the emergency','Dispatch quality',body);return}
  else if(k==='dispatch'){
    body='<div class="stats">'+st('JIBON median',mins(med(J.map(function(c){return c.dec}))))+
      st('Conventional',mins(med(B.map(function(c){return c.dec}))))+
      st('Recovered',mins(med(B.map(function(c){return c.dec}))-med(J.map(function(c){return c.dec}))))+'</div>'+
      '<div class="quote">The interval AI coordination compresses hardest. A conventional call spends one to two '+
      'minutes on a voice interview before anyone decides what to send. Classification from speech and image '+
      'happens in under a second, so the decision is made while the caller is still talking.</div>';
    sheet('Time to dispatch','Call raised → ambulance assigned',body);return}
  else if(k==='docs'){
    list=J.filter(function(c){return c.doc});title='Clinicians connected'}
  else {list=act;title='Cases'}

  body='<div class="stats">'+st('Cases',list.length)+
    st('Critical',list.filter(function(c){return c.pri==='P1'}).length)+
    st('In transit',list.filter(function(c){return c.stage==='Transporting'}).length)+'</div>'+
    '<div>'+list.slice(0,14).map(caseHTML).join('')+'</div>';
  sheet(title,'Last 30 days · '+list.length+' cases',body);
}

function openCase(id,keep){
  var c=CASES.filter(function(x){return x.id===id})[0];if(!c)return;
  selCase=id;var T=TYPES[c.type];
  sheet(T.i+' '+T.n,c.id+' · '+c.place,
    '<div class="row wrap"><span class="pill '+priCls(c.pri)+'">'+c.pri+' Critical</span>'+
    '<span class="pill nu">'+esc(c.stage)+'</span>'+
    '<span class="pill '+(c.mode==='jibon'?'ok':'nu')+'">'+(c.mode==='jibon'?'JIBON coordinated':'Conventional')+'</span></div>'+
    '<div class="stats">'+st('Call → dispatch',mins(c.dec))+st('To patient',mins(c.resp))+
    st('End to end',mins(c.total))+st('Hospital lead',mins(c.lead))+'</div>'+
    '<div><div class="eyebrow" style="margin-bottom:9px">Emergency brief</div>'+briefRows(c)+'</div>'+
    '<div class="quote"><div class="eyebrow" style="margin-bottom:6px">Caller, verbatim</div>'+esc(c.say)+'</div>'+
    '<div><div class="eyebrow" style="margin-bottom:9px">Route plan</div>'+routeHTML(c)+'</div>'+
    '<div><div class="eyebrow" style="margin-bottom:9px">Equipment manifest</div>'+
    (KIT[c.type]||KIT.other).map(function(k){return '<div class="row" style="padding:4px 0;font-size:13px">'+
      '<span class="dot" style="color:'+(k[1]?'var(--red)':'var(--dim)')+'"></span>'+
      '<span style="color:var(--mid)">'+esc(k[0])+'</span></div>'}).join('')+'</div>'+
    '<div><div class="eyebrow" style="margin-bottom:9px">Hospital preparation — '+esc(HOSP[c.dest].c)+'</div>'+
    (PREP[c.type]||PREP.other).map(function(p){return '<div class="row" style="padding:4px 0;font-size:13px">'+
      '<span class="dot" style="color:'+(p[1]?'var(--red)':'var(--dim)')+'"></span>'+
      '<span style="color:var(--mid)">'+esc(p[0])+'</span></div>'}).join('')+'</div>'+
    '<div><div class="eyebrow" style="margin-bottom:9px">Timeline</div>'+tlHTML(c)+'</div>');
}

function openHosp(id){
  var H=HOSP[id];if(!H)return;
  var inb=CASES.filter(function(c){return c.dest===id});
  var rel=CASES.filter(function(c){return (c.relays||[]).indexOf(id)>=0});
  sheet(H.n,'Tier '+H.t+' · '+H.c,
    '<div class="stats">'+st('Inbound',inb.length)+st('Active',inb.filter(active).length)+
    st('Relay legs',rel.length)+st('Beds',H.beds)+'</div>'+
    '<div><div class="eyebrow" style="margin-bottom:9px">Capabilities</div>'+
    '<div class="row wrap">'+H.cap.map(function(x){return '<span class="pill nu">'+esc(x)+'</span>'}).join('')+'</div></div>'+
    (rel.length?'<div><div class="eyebrow" style="margin-bottom:6px">Relay role</div>'+
      '<p style="font-size:12.5px;color:var(--mid);line-height:1.65">Cases passing through where this facility hands '+
      'supplies and a clinician to the ambulance at the roadside — without admitting the patient. '+
      'The level of care rises during the journey instead of flatlining until arrival.</p></div>':'')+
    '<div><div class="eyebrow" style="margin-bottom:9px">Inbound cases</div>'+
    (inb.filter(active).slice(0,6).map(caseHTML).join('')||'<p style="color:var(--dim);font-size:12.5px">None active.</p>')+'</div>');
}

/* "Why this hospital?" — names the nearer hospital it rejected, and why. */
function whyHosp(id){
  var c=CASES.filter(function(x){return x.id===id})[0];if(!c)return;
  var T=TYPES[c.type],D=HOSP[c.dest];
  var near=c.district==='Patuakhali'?HOSP['kuakata-uhc']:HOSP['patuakhali-mch'];
  sheet('Why '+D.c+'?','Routing rationale · '+c.id,
    '<div class="quote"><b>'+esc(D.n)+'</b> was chosen because it holds every capability this case needs — '+
    esc(D.cap.slice(0,4).join(', '))+' — at '+(c.transit||52)+' minutes\' travel.</div>'+
    '<div><div class="eyebrow" style="margin-bottom:9px">Nearer option rejected</div>'+
    '<div class="node" data-k="org"><span class="ic">✕</span><span style="flex:1">'+
    '<span class="nm">'+esc(near.n)+'</span>'+
    '<span class="ns">Closer, but lacks '+esc(T.dept.split(' / ')[0])+' capability</span></span></div>'+
    '<p style="font-size:12.5px;color:var(--mid);margin-top:9px;line-height:1.65">Arriving somewhere sooner that '+
    'cannot perform the definitive treatment does not save time — it spends it. A nearer hospital without the '+
    'theatre, the specialist or the blood is not a destination, it is a delay.</p></div>'+
    (c.relays.length?'<div><div class="eyebrow" style="margin-bottom:9px">Relay selected</div>'+
    '<div class="node" data-k="relay"><span class="ic">🔀</span><span style="flex:1">'+
    '<span class="nm">'+esc(HOSP[c.relays[0]].n)+'</span>'+
    '<span class="ns">Sits on the route · reached in ~35 min · hands up blood, fluids and a clinician</span></span></div>'+
    '<p style="font-size:12.5px;color:var(--mid);margin-top:9px;line-height:1.65">This converts the transfer from '+
    'dead time into <b>escalating care</b>. The patient\'s level of treatment rises at the waypoint instead of '+
    'flatlining until arrival — and it needs no new hospital, ambulance or doctor.</p></div>':'')+
    '<div><div class="eyebrow" style="margin-bottom:6px">Clinical window</div>'+
    '<p style="font-size:12.5px;color:var(--mid)">'+esc(T.n)+' has a '+T.w+'-minute window. '+
    'Every routing decision is measured against it.</p></div>');
}

document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

/* ── Boot ──────────────────────────────────────────────────────────────── */
nav();draw();
</script>
</body>
