<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>JIBON — Emergency Response Intelligence</title>
<meta name="description" content="AI emergency coordination for Bangladesh — classify, route, equip and prepare before the patient arrives." />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="./assets/mark.svg" type="image/svg+xml" />

<link rel="stylesheet" href="./src/styles/tokens.css?v=2" />
<link rel="stylesheet" href="./src/styles/base.css?v=2" />
<link rel="stylesheet" href="./src/styles/layout.css?v=2" />
<link rel="stylesheet" href="./src/styles/components.css?v=2" />
<link rel="stylesheet" href="./src/styles/views.css?v=2" />
<link rel="stylesheet" href="./src/styles/incident.css?v=2" />

<!--
  The theme is read back before first paint so a reload never flashes the wrong
  palette. Kept inline and tiny on purpose: it must run before the body renders.
-->
<script>
  (function () {
    try {
      var saved = localStorage.getItem('jibon.theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) {
      /* Private-mode browsers throw on localStorage. Dark default is fine. */
    }
  })();
</script>
</head>
<body>

<a class="skip-link" href="#view-root">Skip to content</a>

<div class="app" id="app">

  <!-- ── Rail ─────────────────────────────────────────────────────────── -->
  <aside class="rail" aria-label="Primary">
    <a class="rail__brand" href="#/command" aria-label="JIBON home">
      <svg class="rail__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
        <path d="M12 7.5 16.5 10v4L12 16.5 7.5 14v-4z" fill="currentColor" opacity=".85"/>
      </svg>
      <span class="rail__wordmark">
        <strong>JIBON</strong>
        <em>emergency response</em>
      </span>
    </a>

    <nav class="rail__nav" id="rail-nav"><!-- rendered by app.js --></nav>

    <div class="rail__foot">
      <button class="btn btn--ghost btn--block" id="btn-command" type="button">
        <span>Command</span><kbd>Ctrl</kbd><kbd>K</kbd>
      </button>
      <div class="rail__status" id="rail-status" aria-live="polite"></div>
    </div>
  </aside>

  <!-- ── Main column ──────────────────────────────────────────────────── -->
  <div class="main">
    <header class="topbar">
      <div class="topbar__lead">
        <h1 class="topbar__title" id="view-title">Command Center</h1>
        <p class="topbar__sub" id="view-sub"></p>
      </div>

      <div class="topbar__actions">
        <div class="segmented" id="range-picker" role="group" aria-label="Time range"></div>
        <button class="btn btn--ghost icon-btn" id="btn-theme" type="button" aria-label="Toggle theme" title="Toggle theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </button>
        <a class="btn btn--primary" href="#/report" id="btn-report">Report emergency</a>
      </div>
    </header>

    <main class="view" id="view-root" tabindex="-1"><!-- rendered by the active view --></main>
  </div>
</div>

<!-- Overlay surfaces. Kept in the document so their transitions are cheap. -->
<div class="drawer-scrim" id="drawer-scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>
<div class="modal-scrim" id="modal-scrim" hidden></div>
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<noscript>
  <div class="noscript">JIBON is a client-side console and needs JavaScript enabled.</div>
</noscript>


<!--
  Error boundary. Inline so it is never cached and always runs, even when the
  module graph fails to load. A blank screen tells a developer nothing; this
  puts the actual failure on the page.
-->
<script>
  (function () {
    var shown = false;

    function paint(title, detail) {
      if (shown) return;
      shown = true;
      var root = document.getElementById('view-root');
      if (!root) return;
      root.innerHTML = '';

      var box = document.createElement('div');
      box.style.cssText = 'margin:48px auto;max-width:720px;padding:24px;border:1px solid #f42a41;' +
        'border-left:3px solid #f42a41;border-radius:10px;background:#fff;font:14px/1.6 system-ui,sans-serif;color:#0d1a16';

      var head = document.createElement('h2');
      head.textContent = title;
      head.style.cssText = 'margin:0 0 8px;font-size:17px;color:#f42a41';

      var body = document.createElement('pre');
      body.textContent = detail;
      body.style.cssText = 'margin:0 0 16px;padding:12px;background:#f7f9f8;border-radius:6px;' +
        'font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word';

      var hint = document.createElement('p');
      hint.style.cssText = 'margin:0;color:#46564f;font-size:13px';
      hint.innerHTML = 'If this mentions a missing export, your browser is holding stale ES modules. ' +
        'Run <code>python serve.py 8200</code> and open <b>http://localhost:8200</b> &mdash; ' +
        'a new port gets a clean module cache.';

      box.appendChild(head); box.appendChild(body); box.appendChild(hint);
      root.appendChild(box);
    }

    window.addEventListener('error', function (e) {
      paint('Startup failed', (e.message || 'Unknown error') + '

' + (e.filename || '') + ':' + (e.lineno || '?'));
    }, true);

    window.addEventListener('unhandledrejection', function (e) {
      paint('Startup failed', String((e.reason && e.reason.stack) || e.reason || 'Unhandled rejection'));
    });

    // If the module never boots, the rail stays empty. Say so rather than showing white.
    setTimeout(function () {
      var nav = document.getElementById('rail-nav');
      if (nav && !nav.children.length) {
        paint('The application did not start',
          'index.html loaded, but src/app.js never finished executing.
' +
          'Open DevTools (F12) - the Console tab will name the module that failed.');
      }
    }, 2500);
  })();
</script>

<script type="module" src="./src/app.js?v=3"></script>
</body>
</html>
